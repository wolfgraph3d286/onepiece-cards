name: Update prices

on:
  schedule:
    - cron: "30 6 * * *"   # every day at 06:30 UTC
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/update_prices.py
      - name: Commit if prices changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push
